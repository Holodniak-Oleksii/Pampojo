name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm typecheck
      # The database is shared with production, so PR migrations must be additive only.
      - run: pnpm db:migrate
      # Idempotent upsert of the system exercise catalog, so tests and e2e see the repo's data.
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build

  lighthouse:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lighthouse

  e2e:
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
