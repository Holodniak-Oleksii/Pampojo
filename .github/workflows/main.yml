name: Main

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

  migrate:
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate

  # Vercel's Git auto-deploy for main is off (vercel.json), so code never ships before its schema.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm dlx vercel@65.12.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      # The URL is public; brackets expose stray quotes, spaces or a missing https:// in the stored value.
      - name: Show the pulled BETTER_AUTH_URL
        run: |
          if grep -q '^BETTER_AUTH_URL=' .vercel/.env.production.local; then
            grep '^BETTER_AUTH_URL=' .vercel/.env.production.local | sed 's/^BETTER_AUTH_URL=\(.*\)$/BETTER_AUTH_URL=[\1]/'
          else
            echo 'BETTER_AUTH_URL is missing from the pulled production env'
          fi
      - run: pnpm dlx vercel@65.12.1 build --prod --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@65.12.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
