name: Claude Auto Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security, performance and code quality.
            The PR branch is checked out in the current working directory.
            `CLAUDE.md` and `docs/development/` give the rules of this repo.

            Scope:
            1. Run `gh pr diff ${{ github.event.pull_request.number }} --name-only` to get every changed file.
            2. Review every file in that list: source, tests and docs. Do not stop after one area.
            3. If a diff hunk does not give enough context, read the whole file.

            Comments:
            - Post every finding as an inline comment on the exact changed line.
              Use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
            - This includes minor findings. Start each comment with a severity:
              [bug], [security], [perf], [minor] or [nit].
            - If you propose a fix, add a GitHub ```suggestion block that replaces
              exactly the commented lines.
            - Never put a finding only in the summary.

            Summary:
            - At the end, post one short `gh pr comment`.
            - Give the files that you reviewed and the number of inline comments for each severity.
            - Do not repeat the findings there.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
