name: Keepalive

# Free Supabase projects pause after about a week without database activity.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 30 "${{ vars.PROD_URL }}/api/v1/health"
